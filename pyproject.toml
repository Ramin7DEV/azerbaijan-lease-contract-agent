[project]
name = "az-lease-contract-agent"
version = "0.1.0"
description = "AI agent that reviews Azerbaijani lease contracts against the Civil Code and returns a redlined Word file."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ramin Bakhshaliyev" }]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.19.2",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
